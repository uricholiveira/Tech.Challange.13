services:
  db:
    image: postgres:latest
    container_name: db_x
    networks:
      - tech_challange_13
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - postgres_data_x:/var/lib/postgresql/data
  
  redis:
    image: redis:latest
    container_name: redis_x
    networks:
      - tech_challange_13
    ports:
      - "6379:6379"
    volumes:
      - redis_data_x:/data
  
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq_x
    networks:
      - tech_challange_13
    ports:
      - "5672:5672"   # porta AMQP (conexão da aplicação)
      - "15672:15672" # porta do painel web de gerenciamento
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data_x:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
  
  #  api:
  #    build:
  #      dockerfile: Dockerfile
  #      context: .
  #    container_name: api_
  #    networks:
  #      - tech_challange_13
  #    ports:
  #      - "5000:5000"
  #    environment:
  #      ASPNETCORE_ENVIRONMENT: Development
  #    depends_on:
  #      - db
  #      - rabbitmq
  
  localstack:
    image: localstack/localstack:latest
    container_name: localstack_x
    networks:
      - tech_challange_13
    ports:
      - "4572:4572" # s3
      - "4566:4566"
      - "4571:4571"
    environment:
      SERVICES: "s3"
      GATEWAY_LISTEN: "4566"
      AWS_DEFAULT_REGION: "us-east-1"
      PERSISTENCE: 1
    volumes:
      - ./.devops/scripts/localstack:/etc/localstack/init/ready.d
      - localstack_data_x:/var/lib/localstack

volumes:
  postgres_data_x:
  localstack_data_x:
  redis_data_x:
  rabbitmq_data_x:

networks:
  tech_challange_13:
    driver: bridge